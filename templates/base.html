<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory admin</title><style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1d2330}
header{background:#1d2330;color:#fff;padding:12px 20px;display:flex;justify-content:space-between}
header a{color:#cfd6e4}main{max-width:960px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e6e8ec;text-align:left}
input{padding:6px 8px;border:1px solid #c9ced8;border-radius:6px}button{padding:6px 12px;border:0;border-radius:6px;background:#2f6fed;color:#fff;cursor:pointer}
button.del{background:#d64545}.low{color:#d64545;font-weight:600}.msg{background:#e8f1ff;padding:8px 12px;border-radius:6px}
form.inline{display:inline}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>{% block body %}{% endblock %}</body></html>
