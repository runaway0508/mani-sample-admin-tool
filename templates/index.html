{% extends "base.html" %}{% block body %}
<header><strong>Inventory admin</strong><span><a href="/export.csv">Export CSV</a> · <a href="/logout">Log out</a></span></header>
<main>{% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
<div class="card"><form class="row" method="get"><input name="q" value="{{ q }}" placeholder="Search SKU or name">
<label><input type="checkbox" name="low" value="1" {% if low %}checked{% endif %}> Low stock only ({{ n_low }})</label><button>Filter</button></form></div>
<div class="card"><h3>Add item</h3><form class="row" method="post" action="/items">
<input name="sku" placeholder="SKU" required><input name="name" placeholder="Name" required>
<input name="qty" type="number" min="0" placeholder="Qty" required style="width:90px"><input name="reorder_at" type="number" min="0" placeholder="Reorder at" style="width:110px"><button>Add</button></form></div>
<div class="card"><table><tr><th>SKU</th><th>Name</th><th>Qty</th><th>Reorder at</th><th></th></tr>
{% for i in items %}<tr><form method="post" action="/items"><input type="hidden" name="item_id" value="{{ i.id }}">
<td><input name="sku" value="{{ i.sku }}" style="width:100px"></td><td><input name="name" value="{{ i.name }}"></td>
<td><input name="qty" type="number" min="0" value="{{ i.qty }}" style="width:70px" class="{% if i.qty <= i.reorder_at %}low{% endif %}"></td>
<td><input name="reorder_at" type="number" min="0" value="{{ i.reorder_at }}" style="width:70px"></td>
<td><button>Save</button></form> <form class="inline" method="post" action="/items/{{ i.id }}/delete" onsubmit="return confirm('Delete {{ i.sku }}?')"><button class="del">Delete</button></form></td></tr>
{% else %}<tr><td colspan="5">No items.</td></tr>{% endfor %}</table></div></main>{% endblock %}
